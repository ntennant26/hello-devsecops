name: hello-devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the token is read-only unless a job asks for more
permissions:
  contents: read

jobs:
  # ---------------- BUILD STAGE ----------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t hello-devsecops:${{ github.sha }} .

      - name: Save image as build artifact
        run: docker save hello-devsecops:${{ github.sha }} -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------------- TEST STAGE ----------------
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and test tools
        run: pip install -r requirements.txt pytest bandit pip-audit

      - name: Run unit tests
        run: pytest -v

      - name: SAST scan with Bandit
        run: bandit -r . -x ./test_app.py -ll

      - name: Dependency vulnerability scan with pip-audit
        run: pip-audit -r requirements.txt

  # ---------------- DEPLOY STAGE ----------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # only this job may push images
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run container and smoke test
        run: |
          docker run -d --name hello -p 8080:8080 hello-devsecops:${{ github.sha }}
          sleep 5
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep "hello, world!"
          docker exec hello whoami | grep appuser   # verify non-root

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR (deploy)
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker tag hello-devsecops:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "Deployed $IMAGE"
